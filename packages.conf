#####################################################################
# Author    : Erik Dubois
# Website   : https://kiroproject.be
#####################################################################
#
#   DO NOT JUST RUN THIS. EXAMINE AND JUDGE. RUN AT YOUR OWN RISK.
#
# Purpose:
#   Single source of truth for how every package directory in this repo
#   is kept up to date. Sourced by aur-sync.sh, build.sh and
#   1-build-all-packages.sh -- it is data, never logic.
#
#   Three classes, because the three need different upstream signals:
#
#     aur-fixed  Package lives on the AUR with a real upstream version.
#                Rebuild when the AUR pkgver/pkgrel/epoch changes.
#
#     aur-vcs    Package lives on the AUR but is a -git/VCS package.
#                The AUR pkgver is FROZEN and tells you nothing -- it is
#                only rewritten by pkgver() at build time. The real
#                signal is the upstream git push, so these carry an
#                upstream URL + ref and are compared with git ls-remote.
#
#     local      Not on the AUR at all. Never synced, never auto-bumped;
#                falls back to the local pkgver/pkgrel check.
#
# Why:
#   The old flow compared the local PKGBUILD against .previous-version,
#   which is a local file-vs-file diff and knows nothing about upstream.
#   Fixed-version packages silently went stale and VCS packages never
#   rebuilt at all. Classifying each package here makes the upstream
#   signal explicit and lets the sync fail loudly on an unknown package
#   instead of skipping it in silence.
#####################################################################

# ── aur-fixed ────────────────────────────────────────────────────────
# PKG_CLASS[<dir>]="aur-fixed"
declare -A PKG_CLASS=(
    [arc-gtk-theme]="aur-fixed"
    [gnome-bluetooth]="aur-fixed"
    [lastpass]="aur-fixed"
    [libpamac-aur]="aur-fixed"
    [pacman-hook-kernel-install]="aur-fixed"
    [pamac-aur]="aur-fixed"
    [sway-scroll]="aur-fixed"
    [ttf-material-design-iconic-font]="aur-fixed"
    [wlroots0.18]="aur-fixed"

    [ckb-next-git]="aur-vcs"
    [flameshot-git]="aur-vcs"
    [hardcode-fixer-git]="aur-vcs"
    [noctalia-git]="aur-vcs"
    [sparklines-git]="aur-vcs"
    [tinty-git]="aur-vcs"

    [chwd]="local"
    [wttr]="local"
)

# ── aur-vcs upstream sources ─────────────────────────────────────────
# The repo git ls-remote is run against. Ref is the branch the PKGBUILD
# pins in its source= line, or HEAD when it does not pin one.
declare -A PKG_UPSTREAM=(
    [ckb-next-git]="https://github.com/ckb-next/ckb-next.git"
    [flameshot-git]="https://github.com/flameshot-org/flameshot.git"
    [hardcode-fixer-git]="https://github.com/Foggalong/hardcode-fixer.git"
    [noctalia-git]="https://github.com/noctalia-dev/noctalia.git"
    [sparklines-git]="https://github.com/holman/spark.git"
    [tinty-git]="https://github.com/tinted-theming/tinty.git"
)

declare -A PKG_UPSTREAM_REF=(
    [noctalia-git]="main"
)

# ── Notes on individual packages ─────────────────────────────────────
#
# gnome-bluetooth   Has a git+ source but pins #commit=$_commit, so it is
#                   a fixed-version package, not a rolling one.
#
# wlroots0.18       Carries a Kiro local delta (-D werror=false: current
#                   libinput added LIBINPUT_SWITCH_KEYPAD_SLIDE which EOL
#                   wlroots 0.18 does not handle, and it builds with
#                   werror=true). aur-sync.sh must replay this on top of
#                   any new AUR tree, never silently drop it.
#
# chwd              Deliberately pinned to 1.23.0. Upstream 1.24.0 ported
#                   scripts/chwd-kernel to a hand-declared FFI on
#                   alpm_pkg_get_installed_db(), which does not exist in
#                   Arch's libalpm.so.16. 1.24.x is knowingly skipped --
#                   this package must NEVER be auto-bumped.
#####################################################################
