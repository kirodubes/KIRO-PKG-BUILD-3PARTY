#####################################################################
# Author    : Erik Dubois
# Website   : https://kiroproject.be
#####################################################################
#
#   Data for tools/rebuild-watch.sh -- never logic.
#
#   One line per Arch package whose update breaks packages we built:
#
#     trigger | mode | packages to rebuild | what to do
#
#   mode:
#     version  pkgver changed (pkgrel ignored)
#     minor    major.minor changed (3.14 -> 3.15, 6.12 -> 6.13)
#     soname   the lib*.so= entries in its Provides changed; a package
#              that provides no sonames falls back to minor
#
#   The trigger is looked up in core first, then extra.
#####################################################################

hyprland        | version | hyprglass hypr-dynamic-cursors | Set each _commit to the pin in its upstream hyprpm.toml for the new Hyprland, bump pkgver/pkgrel, run build.sh in ~/KIRO-PKG-BUILD-3PARTY/<pkg>
pacman          | soname  | libpamac-aur pamac-aur chwd | Run build.sh in ~/KIRO-PKG-BUILD-3PARTY/<pkg> (libpamac-aur before pamac-aur)
python          | minor   | python-pywal16 | Bump pkgrel, run build.sh in ~/KIRO-PKG-BUILD-3PARTY/python-pywal16
qt6-base        | minor   | calamares calamares-next kirotux-calamares flameshot-git ckb-next-git qt6-m3shapes-git caelestia-shell | calamares: newest calamares-* / calamares-next-* in ~/KIRO-PKG-BUILD-CALAMARES, kirotux-calamares in ~/KIROTUX-PKG-BUILD; the rest in ~/KIRO-PKG-BUILD-3PARTY (qt6-m3shapes-git before caelestia-shell)
kpmcore         | soname  | calamares calamares-next kirotux-calamares | Newest calamares-* / calamares-next-* in ~/KIRO-PKG-BUILD-CALAMARES, kirotux-calamares in ~/KIROTUX-PKG-BUILD
boost-libs      | soname  | calamares calamares-next kirotux-calamares | Newest calamares-* / calamares-next-* in ~/KIRO-PKG-BUILD-CALAMARES, kirotux-calamares in ~/KIROTUX-PKG-BUILD
icu             | soname  | calamares calamares-next kirotux-calamares | Newest calamares-* / calamares-next-* in ~/KIRO-PKG-BUILD-CALAMARES, kirotux-calamares in ~/KIROTUX-PKG-BUILD
yaml-cpp        | soname  | calamares calamares-next kirotux-calamares | Newest calamares-* / calamares-next-* in ~/KIRO-PKG-BUILD-CALAMARES, kirotux-calamares in ~/KIROTUX-PKG-BUILD
libdisplay-info | soname  | sway-scroll wlroots0.18 | Run build.sh in ~/KIRO-PKG-BUILD-3PARTY/<pkg> (wlroots0.18 first)
libliftoff      | soname  | sway-scroll wlroots0.18 | Run build.sh in ~/KIRO-PKG-BUILD-3PARTY/<pkg> (wlroots0.18 first)
libqalculate    | soname  | caelestia-shell | Delete ~/KIRO-PKG-BUILD-3PARTY/caelestia-shell/.build-state, then run build.sh there
