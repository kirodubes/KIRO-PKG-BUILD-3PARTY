#####################################################################
#
#   Data for tools/rebuild-watch.sh -- never logic.
#
#   One line per upstream project we vendor or pin into a package:
#
#     name | kind | source | package to rebuild | what to do
#
#   kind:
#     release  source = a local UPSTREAM file (GitHub URL on its first
#              line, "tag: vX" line). Alert when the latest GitHub
#              release differs from that tag, once per release.
#     pins     source = owner/repo on GitHub. Watch the commit_pins in
#              its hyprpm.toml (Hyprland commit -> plugin commit).
#              Alert when a pin is added or changed; the first run
#              only records them.
#####################################################################

impasto              | release | ~/KIRO/kiro-hyprland-impasto/UPSTREAM | kiro-hyprland-impasto | Bump per kiro-hyprland-impasto/CLAUDE.md (vendor branch + merge), test the upgrade on riker/picard with the KiroTux Impasto SSD, then flow-kiro-hyprland-impasto
hyprglass            | pins    | hyprnux/hyprglass                     | hyprglass             | Set _commit to the new pin when it is for the Hyprland Arch ships, bump pkgver/pkgrel, run flow-hyprland-plugins
hypr-dynamic-cursors | pins    | VirtCode/hypr-dynamic-cursors         | hypr-dynamic-cursors  | Set _commit to the new pin when it is for the Hyprland Arch ships, bump pkgver/pkgrel, run flow-hyprland-plugins
